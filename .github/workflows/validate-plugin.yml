name: validate-plugin

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      # The pinned floor is installed from the upstream GitHub release binary,
      # verifying the SHA-256 published in that release's SHASUMS256.txt before
      # ever executing it. This began when npm lagged behind GitHub Releases
      # (ADR-0022); npm has since caught up, but a checksum-pinned binary stays
      # the more deterministic install for a PR-blocking gate. The floor is
      # 2.1.318, the build KRYLO was last verified on live (ADR-0042).
      - name: Install pinned Claude Code CLI (2.1.318, checksum-verified GitHub release binary)
        run: |
          curl -fsSL -o claude-linux-x64.tar.gz "https://github.com/anthropics/claude-code/releases/download/v2.1.318/claude-linux-x64.tar.gz"
          echo "e6d426ca0c123f61fad58a361da0329f2a93cd206bc87040ed8d9576dd9eb583  claude-linux-x64.tar.gz" | sha256sum -c -
          tar -xzf claude-linux-x64.tar.gz
          sudo install -m 0755 claude /usr/local/bin/claude
          rm -f claude claude-linux-x64.tar.gz
          claude --version
      - name: Validate plugin manifest (strict)
        run: claude plugin validate --strict plugins/krylo
      - name: Validate marketplace manifest (strict)
        run: claude plugin validate --strict .
      - name: Enforce repository instructions line budget
        run: |
          # AGENTS.md is the instructions index; CLAUDE.md only imports it.
          for f in AGENTS.md CLAUDE.md; do
            lines=$(wc -l < "$f")
            echo "$f lines: $lines"
            test "$lines" -le 130
          done
          grep -qx '@AGENTS.md' CLAUDE.md
