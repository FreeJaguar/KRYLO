name: secret-scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "45 5 * * 1"

permissions:
  contents: read

concurrency:
  group: secretscan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          # --results=verified,unknown keeps full detection sensitivity
          # (including unverified findings) everywhere in the repository.
          # --exclude-paths only excludes the specific test fixtures listed
          # in .github/trufflehog-exclude.txt, which contain synthetic,
          # non-functional secrets used to test scripts/lib/redact.mjs.
          extra_args: --results=verified,unknown --exclude-paths=.github/trufflehog-exclude.txt
