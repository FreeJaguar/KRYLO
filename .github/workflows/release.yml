name: release

# Releases are approval-gated: this workflow runs only on manual dispatch
# by a maintainer, never automatically (SECURITY.md, docs/17).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag in the current `claude plugin tag` format (for example krylo--v0.2.0). Must match plugin.json's name and version."
        required: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      # See validate-plugin.yml for why this installs from the upstream GitHub
      # release binary (checksum-verified) rather than npm: the npm registry
      # has not published a version past 2.1.197 as of this checkpoint.
      - name: Install pinned Claude Code CLI (2.1.223, GitHub release binary -- npm has not published past 2.1.197)
        run: |
          curl -fsSL -o claude-linux-x64.tar.gz "https://github.com/anthropics/claude-code/releases/download/v2.1.223/claude-linux-x64.tar.gz"
          echo "0b516307190edfb776501e5c12a32d7d0c0b01d1110fa6539fd187a8482ad24f  claude-linux-x64.tar.gz" | sha256sum -c -
          tar -xzf claude-linux-x64.tar.gz
          sudo install -m 0755 claude /usr/local/bin/claude
          rm -f claude claude-linux-x64.tar.gz
          claude --version
      - name: Validate plugin and marketplace (strict)
        run: |
          claude plugin validate --strict plugins/krylo
          claude plugin validate --strict .
      - name: Run tests
        run: npm test
      - name: Check tag matches plugin name and version (claude plugin tag format)
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          name=$(node -p "JSON.parse(require('fs').readFileSync('plugins/krylo/.claude-plugin/plugin.json','utf8')).name")
          v=$(node -p "JSON.parse(require('fs').readFileSync('plugins/krylo/.claude-plugin/plugin.json','utf8')).version")
          test "$name--v$v" = "$TAG"

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build release archive and checksums
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          git archive --format=zip --output "$TAG.zip" HEAD
          sha256sum "$TAG.zip" > "$TAG.zip.sha256"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ github.event.inputs.tag }}.zip
      - name: Create GitHub release (draft)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          # `gh release create` with no --target tags whatever commit the
          # repository's default branch points to at the moment the release
          # is actually created/finalized -- not the commit this job
          # checked out and built the archive from. Because this release is
          # `--draft`, GitHub does not fix a draft's target_commitish at
          # creation time at all (confirmed against GitHub's own release
          # API description: "unused if the git tag already exists" /
          # resolved from the default branch); it is only resolved when a
          # human later PUBLISHES the draft. So the mismatch window is not
          # merely "between this job's checkout and this step running" --
          # it is open for as long as the draft sits unpublished, and `main`
          # can advance any number of times (any number of merges) in that
          # window with no warning. github.sha is fixed for the whole
          # workflow run to the commit resolved at dispatch time (and is
          # preserved verbatim across a re-run), so pinning the tag to it
          # explicitly closes this regardless of how long the draft
          # persists or what happens to the branch meanwhile.
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --draft \
            --title "KRYLO $TAG" \
            --notes "See CHANGELOG.md." \
            "$TAG.zip" "$TAG.zip.sha256"
