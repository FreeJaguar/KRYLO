name: release

# Releases are approval-gated: this workflow runs only on manual dispatch
# by a maintainer, never automatically (SECURITY.md, docs/17).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag in the current `claude plugin tag` format (for example krylo--v0.2.0). Must match plugin.json's name and version."
        required: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      # See validate-plugin.yml for why this installs from the upstream GitHub
      # release binary (checksum-verified) rather than npm: the npm registry
      # has not published a version past 2.1.197 as of this checkpoint.
      - name: Install pinned Claude Code CLI (2.1.223, GitHub release binary -- npm has not published past 2.1.197)
        run: |
          curl -fsSL -o claude-linux-x64.tar.gz "https://github.com/anthropics/claude-code/releases/download/v2.1.223/claude-linux-x64.tar.gz"
          echo "0b516307190edfb776501e5c12a32d7d0c0b01d1110fa6539fd187a8482ad24f  claude-linux-x64.tar.gz" | sha256sum -c -
          tar -xzf claude-linux-x64.tar.gz
          sudo install -m 0755 claude /usr/local/bin/claude
          rm -f claude claude-linux-x64.tar.gz
          claude --version
      - name: Validate plugin and marketplace (strict)
        run: |
          claude plugin validate --strict plugins/krylo
          claude plugin validate --strict .
      - name: Run tests
        run: npm test
      - name: Check tag matches plugin name and version (claude plugin tag format)
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          name=$(node -p "JSON.parse(require('fs').readFileSync('plugins/krylo/.claude-plugin/plugin.json','utf8')).name")
          v=$(node -p "JSON.parse(require('fs').readFileSync('plugins/krylo/.claude-plugin/plugin.json','utf8')).version")
          test "$name--v$v" = "$TAG"

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Build release archive and checksums
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          git archive --format=zip --output "$TAG.zip" HEAD
          sha256sum "$TAG.zip" > "$TAG.zip.sha256"
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ github.event.inputs.tag }}.zip
      - name: Create GitHub release (draft)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          gh release create "$TAG" \
            --draft \
            --title "KRYLO $TAG" \
            --notes "See CHANGELOG.md." \
            "$TAG.zip" "$TAG.zip.sha256"
