name: upstream-watch

# Weekly Upstream Watch (docs/adr/0036-weekly-upstream-watch.md,
# docs/process/MULTI_HOST_CODEX_MAINTENANCE_DESIGN.md Section 15).
#
# Detects that a REVIEWED external integration has moved upstream since KRYLO
# reviewed it, and says how much a human needs to care. Strictly read-only:
# it never writes a repository file, never promotes an observed upstream ref
# into catalog/tools.json, never opens a pull request or an issue, and never
# executes anything belonging to a watched candidate (Section 15.5 -- no
# npm/pip install, no npx, no candidate scripts, hooks, MCP servers, or build
# systems, and nothing copied from upstream documentation).
#
# Never triggered by push or pull_request, so it can never block a PR or a
# release, and it exits 0 even when drift is found -- drift is evidence for a
# separate, human-initiated review, not a build failure.

on:
  schedule:
    - cron: "20 6 * * 1" # weekly, Mondays 06:20 UTC
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: upstream-watch-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Run Weekly Upstream Watch (read-only)
        # Explicit exit-code capture rather than relying on the shell's
        # pipefail default, for the same reason ecosystem-maintenance.yml
        # documents: piping into tee would report tee's status and silently
        # mask a real internal failure.
        run: |
          set +e
          node plugins/krylo/scripts/maintenance/check-upstream-watch.mjs > watch.txt
          code=$?
          cat watch.txt >> "$GITHUB_STEP_SUMMARY"
          cat watch.txt
          exit "$code"
      - name: Upload drift report artifact
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: upstream-watch-report
          path: watch.txt
          retention-days: 30
