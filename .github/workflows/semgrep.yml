name: semgrep

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: semgrep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Run Semgrep (pinned, metrics off)
        run: |
          # plugins/krylo/tests/** is excluded because several fixtures
          # intentionally contain synthetic, non-functional secret-shaped
          # strings (see .github/trufflehog-exclude.txt) to test redaction;
          # application code is fully scanned.
          pipx run semgrep==1.170.0 scan --config p/ci --metrics=off --error \
            --exclude 'plugin/**' --exclude 'plugins/krylo/tests/**'
